[project]
name = "proofpay"
version = "0.1.0"
description = "Escrowed bounties for GitHub issues: PayPal holds the money, CI and an AI judge release it."
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]>=2.24,<3",
    "dishka>=1.10,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "sqlalchemy[asyncio,postgresql_psycopg]>=2.0.52,<2.2",
    "alembic>=1.19,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=26.1",
    "uvicorn[standard]>=0.52",
    "procrastinate[psycopg]>=3.9,<4",
    "httpx>=0.28",
    "google-genai",
    "mcp",
]

[project.scripts]
proofpay-api = "proofpay.app:main"
proofpay-worker = "proofpay.worker:main"
proofpay-mcp = "proofpay.mcp_server:main"
proofpay-cli = "proofpay.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov",
    "time-machine>=3.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "dirty-equals>=0.11",
    "import-linter>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofpay"]

# --- ruff ---------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # full base set
    "F", "E", "W", "I", "N", "UP", "B", "SIM", "C4",
    "S", "ANN", "ASYNC", "G", "PL", "RUF",
    # added on review
    "DTZ",   # naive datetimes
    "LOG",   # logging
    "PT",    # pytest
    "TC",    # typing-only imports
    "TRY",   # exception handling
    "RET",   # return
    "PTH",   # pathlib
    "SLF",   # private member access
    "T20",   # print instead of logging
    "ERA",   # commented-out code
]
ignore = [
    "RUF012",                         # mutable class defaults in SQLAlchemy models
    "TRY003",                         # long exception messages
    "TC001", "TC002", "TC003",        # Dishka resolves types at runtime: TYPE_CHECKING breaks DI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S107",
    "PLR2004", "PLR0913", "PLC0415",
    "ANN001", "ANN201", "ANN202", "ANN401",
    "E501",   # a test docstring explains the check, wrapping hurts readability
    "PT006",  # a string in parametrize is shorter and clearer than a tuple
]
"proofpay/shared/db/migrations/**" = ["ANN"]
"proofpay/**/models.py" = ["ANN"]
"migrations/versions/**" = ["E501", "ANN", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["proofpay"]

[tool.ruff.lint.pylint]
max-args = 8

# --- mypy ---------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests"
disallow_untyped_defs = false

# --- pytest -------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "boundary: module boundary tests",
    "integration: integration tests that need a database",
]

# --- import-linter ------------------------------------------------
[tool.importlinter]
root_packages = ["proofpay"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "module-layers"
name = "Layers follow the dependency graph"
type = "layers"
layers = [
    "proofpay.modules.bounties",
    "proofpay.integrations",
    "proofpay.shared",
]

[[tool.importlinter.contracts]]
id = "shared-no-modules"
name = "Shared code does not know about modules or integrations"
type = "forbidden"
source_modules = ["proofpay.shared"]
forbidden_modules = ["proofpay.modules", "proofpay.integrations"]
