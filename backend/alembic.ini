[alembic]
script_location = migrations

# Revision filename: date, time, revision id, slug.
# Date first so files sort in apply order; revision id so a file can be
# located by the id printed by `alembic history`.
# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale",
# which is cp1251 on Windows, and non-ASCII bytes crash the config parser.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Left empty on purpose: migrations/env.py unconditionally overrides it with
# Settings().database_url (env var PROOFPAY_DATABASE_URL). A value here would
# be dead config, and a password here would be a leak.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
