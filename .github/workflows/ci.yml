name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proofpay
          POSTGRES_PASSWORD: proofpay
          POSTGRES_DB: proofpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofpay -d proofpay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PROOFPAY_TEST_DATABASE_URL: postgresql+psycopg://proofpay:proofpay@localhost:5432/proofpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run mypy proofpay
      - run: uv run pytest --cov=proofpay

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_leaks.sh
