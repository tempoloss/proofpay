# nginx for the ProofPay web container: static frontend + API/MCP proxies.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Upstreams are resolved per request through Docker's embedded DNS, so a
    # recreated api or mcp container (new address) is found without restarting
    # nginx. With a variable and no URI part, proxy_pass keeps the request URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $mcp_upstream http://mcp:8001;

    # Single-page application fallback.
    location / {
        try_files $uri /index.html;
    }

    # REST API (path kept, proxied to the api service).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PayPal return/cancel redirect endpoints.
    location /paypal/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP over streamable HTTP: no buffering, long-lived connections.
    location /mcp {
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
