# nginx for the ProofPay web container: static frontend + API/MCP proxies.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page application fallback.
    location / {
        try_files $uri /index.html;
    }

    # REST API (path kept, proxied to the api service).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PayPal return/cancel redirect endpoints.
    location /paypal/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP over streamable HTTP: no buffering, long-lived connections.
    location /mcp {
        proxy_pass http://mcp:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
