# nginx for the ProofPay web container: static frontend + API/MCP proxies.

# Write rate limit. All traffic arrives through the Cloudflare tunnel, so the
# peer address is always the docker gateway: key on the real client address
# from CF-Connecting-IP and fall back to the peer address when it is absent.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

# Only POST requests get a key; an empty key is not accounted by limit_req,
# so GET/HEAD/OPTIONS are never limited.
map $request_method $api_write_key {
    POST    $client_key;
    default "";
}

limit_req_zone $api_write_key zone=api_writes:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Upstreams are resolved per request through Docker's embedded DNS, so a
    # recreated api or mcp container (new address) is found without restarting
    # nginx. With a variable and no URI part, proxy_pass keeps the request URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $mcp_upstream http://mcp:8001;

    # Single-page application fallback.
    location / {
        try_files $uri /index.html;
    }

    # REST API (path kept, proxied to the api service). Writes are limited to
    # 6 per minute per client with a burst of 4.
    location /api/ {
        limit_req zone=api_writes burst=4 nodelay;
        error_page 429 @rate_limited;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too many requests, try again in a minute","status":429,"code":"RATE_LIMITED"}';
    }

    # PayPal return/cancel redirect endpoints.
    location /paypal/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP over streamable HTTP: no buffering, long-lived connections.
    location /mcp {
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
